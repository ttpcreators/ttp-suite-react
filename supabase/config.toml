# ============================================================================
# Supabase config — project ref: zizvggziggswhrbuyhuo
# ----------------------------------------------------------------------------
# verify_jwt PAR FONCTION. CRITIQUE : sans ces blocs, le défaut verify_jwt=true
# rejette (401 plateforme, avant votre code) :
#   - google-oauth-callback  (redirect navigateur GET, aucun JWT)
#   - google-webhook         (appelé par Google, aucun JWT)
#   - google-watch-renew     (pg_cron avec CRON_SECRET, pas un JWT Supabase)
#   - google-sync            (appels internes CRON_SECRET, pas un JWT)
# Ces 4 fonctions font leur auth applicative (state signé / channel token /
# CRON_SECRET / JWT-ou-CRON) DANS le code.
# ============================================================================

project_id = "zizvggziggswhrbuyhuo"

# --- Fonctions publiques (auth applicative interne) -------------------------
[functions.google-oauth-callback]
verify_jwt = false

[functions.google-webhook]
verify_jwt = false

[functions.google-watch-renew]
verify_jwt = false

# google-sync : verify_jwt=false OBLIGATOIRE (sinon les appels CRON_SECRET,
# non-JWT, sont rejetés). L'auth est faite dans le code : JWT agence via
# getUser()+profiles.role='agency' OU Bearer CRON_SECRET (temps constant).
[functions.google-sync]
verify_jwt = false

# daily-digest : résumé push matinal, appelé par pg_cron avec le CRON_SECRET
# (pas un JWT) → verify_jwt=false obligatoire ; l'auth CRON_SECRET est dans le code.
[functions.daily-digest]
verify_jwt = false

# report-error : reçoit les crashs de l'ErrorBoundary (même déconnecté, ex. écran
# login) → verify_jwt=false. Ne fait que journaliser + notifier l'agence (anti-spam).
[functions.report-error]
verify_jwt = false

# --- Fonctions appelées par le front (JWT agence exigé) ---------------------
# verify_jwt=true : la plateforme valide le JWT ; le code exige EN PLUS le rôle agence.
[functions.google-connect-url]
verify_jwt = true

[functions.google-status]
verify_jwt = true

[functions.google-disconnect]
verify_jwt = true

# creator-history : JWT requis (créateur → ses mesures ; agence → tout).
[functions.creator-history]
verify_jwt = true

# debrief-history : JWT requis (créateur → ses debriefs ; agence → tous).
[functions.debrief-history]
verify_jwt = true

# creator-report : JWT requis (créateur → son rapport mensuel ; agence → le créateur demandé).
[functions.creator-report]
verify_jwt = true

# create-access : JWT agence requis — crée un compte via l'API admin.
[functions.create-access]
verify_jwt = true

# send-email : JWT agence requis — envoie via Resend (clé en secret serveur).
[functions.send-email]
verify_jwt = true

# gmail-send : JWT agence requis — envoie depuis la vraie boîte Gmail (OAuth).
[functions.gmail-send]
verify_jwt = true

# gmail-history : JWT agence requis — lit les fils Gmail avec un contact.
[functions.gmail-history]
verify_jwt = true

# gmail-thread : JWT agence requis — lit un fil Gmail complet (corps des messages).
[functions.gmail-thread]
verify_jwt = true

# gmail-trash : JWT agence requis — met un fil Gmail à la corbeille (ou l'en sort).
[functions.gmail-trash]
verify_jwt = true

# gmail-poll : appelé par pg_cron (CRON_SECRET) ou agence (JWT) → verify_jwt=false,
# auth applicative dans le code (CRON_SECRET OU rôle agence).
[functions.gmail-poll]
verify_jwt = false

# gmail-reconcile : scan invisible des mails SORTANTS (touches prospection),
# appelé par pg_cron (CRON_SECRET) → verify_jwt=false, auth dans le code.
[functions.gmail-reconcile]
verify_jwt = false

# creator-mail : JWT requis (créatrice OU agence) — section « Mails » de l'Espace
# Créateur, lecture Gmail filtrée côté serveur par alias/libellé (gmail.readonly).
[functions.creator-mail]
verify_jwt = true

# team-notify : notifications « qui fait quoi » de l'équipe agence. JWT requis
# (verify_jwt) + rôle agence vérifié dans le code ; envoie aux AUTRES comptes agence.
[functions.team-notify]
verify_jwt = true

# --- Instagram (API officielle de Meta) -------------------------------------
# ig-avatar : photos + chiffres du Scouting. JWT requis + rôle agence dans le code.
[functions.ig-avatar]
verify_jwt = true

# ig-sync : chiffres Instagram du roster, des collabs et des marques. Appelé par
# pg_cron (CRON_SECRET, pas un JWT) → verify_jwt=false ; auth dans le code
# (CRON_SECRET OU rôle agence).
[functions.ig-sync]
verify_jwt = false

# ig-connect : une créatrice connecte son Instagram (JWT ; créatrice = elle-même,
# agence = la créatrice nommée).
[functions.ig-connect]
verify_jwt = true

# ig-callback : retour d'Instagram (redirection du navigateur, sans JWT) →
# verify_jwt=false ; l'authenticité tient au state signé.
[functions.ig-callback]
verify_jwt = false

# ig-hashtag : recherche par hashtag (Scouting). JWT requis + rôle agence.
[functions.ig-hashtag]
verify_jwt = true

# ig-sourcing : page Sourcing (créatrices citées par une marque, liste de @) et
# Radar à marques (scan de nuit par pg_cron avec CRON_SECRET) → verify_jwt=false ;
# auth dans le code (CRON_SECRET OU rôle agence).
[functions.ig-sourcing]
verify_jwt = false

# yt-sourcing : Sourcing YouTube (YouTube Data API v3, clé YT_API_KEY). JWT requis
# + rôle agence vérifié dans le code.
[functions.yt-sourcing]
verify_jwt = true

# ig-inbox : DM du compte Instagram de TTP (cron horaire avec CRON_SECRET, ou bouton
# « Actualiser » de l'agence) → verify_jwt=false ; auth dans le code.
[functions.ig-inbox]
verify_jwt = false

# ig-publish : posts programmés (cron chaque minute avec CRON_SECRET, ou « Publier
# maintenant » de l'agence) → verify_jwt=false ; auth dans le code.
[functions.ig-publish]
verify_jwt = false

# ig-webhook : Meta appelle cette adresse à chaque DM (pas de JWT) → verify_jwt=false ;
# authenticité = signature X-Hub-Signature-256 (META_APP_SECRET), vérifiée dans le code.
[functions.ig-webhook]
verify_jwt = false

# tt-connect : une créatrice (ou l'agence pour elle) lance / coupe la connexion TikTok.
# JWT requis + rôle vérifié dans le code (même schéma que ig-connect).
[functions.tt-connect]
verify_jwt = true

# tt-callback : retour du navigateur depuis TikTok (sans JWT) → verify_jwt=false ;
# l'authenticité tient au state signé.
[functions.tt-callback]
verify_jwt = false

# tt-sync : chiffres TikTok (cron quotidien avec CRON_SECRET, ou agence) → verify_jwt=false ;
# auth dans le code.
[functions.tt-sync]
verify_jwt = false

# tt-radar : radar à collabs TikTok (cron quotidien avec CRON_SECRET, ou bouton de
# l'agence) → verify_jwt=false ; auth dans le code.
[functions.tt-radar]
verify_jwt = false

# yt-radar : radar à collabs YouTube (cron quotidien avec CRON_SECRET, ou bouton de
# l'agence) → verify_jwt=false ; auth dans le code.
[functions.yt-radar]
verify_jwt = false

# yt-connect : une créatrice (ou l'agence pour elle) lance / coupe la connexion YouTube.
# JWT requis + rôle vérifié dans le code (même schéma que tt-connect).
[functions.yt-connect]
verify_jwt = true

# yt-callback : retour du navigateur depuis Google, via app.ttpcreators.pro/yt-callback/
# (sans JWT) → verify_jwt=false ; l'authenticité tient au state signé.
[functions.yt-callback]
verify_jwt = false

# yt-sync : chiffres YouTube (cron quotidien avec CRON_SECRET, ou agence) → verify_jwt=false ;
# auth dans le code.
[functions.yt-sync]
verify_jwt = false

# ttp-mcp : connecteur Claude (serveur MCP + OAuth, validé par Marc le 2026-10-19). Claude n'a
# pas de session Supabase → verify_jwt=false ; l'accès est contrôlé dans le code par nos propres
# jetons (hachés, 1 h, révocables dans Paramètres → Claude).
[functions.ttp-mcp]
verify_jwt = false
