<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src https://zizvggziggswhrbuyhuo.supabase.co; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Réserver une visio · TTP Creators</title>
<link rel="icon" href="/favicon-32.png">
<style>
  :root { --bg: #f5f5f7; --surface: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: rgba(0,0,0,.08); --accent: #0069fe; --on: #fff; --field: #f2f2f7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --surface: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: rgba(255,255,255,.1); --accent: #3b8cff; --field: #2c2c2e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { margin: 24px 0 4px; font-size: 26px; line-height: 1.2; letter-spacing: -.01em; }
  .sous { margin: 0; color: var(--muted); }
  .carte { margin-top: 24px; background: var(--surface); border-radius: 20px; padding: 20px; }
  .jour + .jour { margin-top: 18px; }
  .jour h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; text-transform: none; }
  .heures { display: flex; flex-wrap: wrap; gap: 8px; }
  button.h { border: 1px solid var(--line); background: var(--field); color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  button.h[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on); }
  form { display: grid; gap: 12px; margin-top: 4px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, textarea { font: inherit; color: var(--text); background: var(--field); border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .deux { grid-template-columns: 1fr; } }
  .choisi { font-weight: 600; color: var(--text); }
  .envoyer { margin-top: 4px; border: 0; background: var(--accent); color: var(--on); border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .envoyer:disabled { opacity: .5; cursor: default; }
  .note { font-size: 13px; color: var(--muted); }
  .erreur { color: #d70015; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .ok h2 { margin: 0 0 6px; font-size: 20px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header><img src="/icon-192.png" alt=""><strong>TTP Creators</strong></header>
  <h1>Réserver une visio avec Marc</h1>
  <p class="sous" id="sous">Choisis un créneau : on parle de ton projet et des créateurs qui y correspondent.</p>
  <section class="carte" id="creneaux"><p class="note">Chargement des créneaux…</p></section>
  <section class="carte" id="formulaire" hidden>
    <form id="form" novalidate>
      <p class="note">Créneau choisi : <span class="choisi" id="choisi"></span> (heure de Paris)</p>
      <div class="hp" aria-hidden="true"><label>Ne pas remplir <input name="site" tabindex="-1" autocomplete="off"></label></div>
      <div class="deux">
        <label>Ton nom <input name="nom" required autocomplete="name"></label>
        <label>Marque ou agence <input name="marque" required autocomplete="organization"></label>
      </div>
      <label>Email pro <input name="email" type="email" required autocomplete="email"></label>
      <label>Ton projet, en deux lignes (facultatif) <textarea name="message" rows="3" placeholder="Lancement, date, budget…"></textarea></label>
      <button class="envoyer" type="submit" id="envoyer">Réserver la visio</button>
      <p class="note erreur" id="erreur" role="status"></p>
    </form>
  </section>
  <section class="carte ok" id="ok" hidden></section>
</main>
<script src="rdv.js"></script>
</body>
</html>
