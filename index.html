    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f4f5" />
    <!-- Web app installé sur l'écran d'accueil (condition des notifications push iOS 16.4+) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Barre d'état iPhone (heure, batterie) : « default » = texte noir sur fond clair.
         « black-translucent » écrit TOUJOURS en blanc : réservé au thème sombre (script ci-dessous). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        if (localStorage.getItem("ttp:theme") === "dark") {
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", "black-translucent");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
        }
      } catch (e) {}
    </script>
