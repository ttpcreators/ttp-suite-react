name: Déploiement des fonctions

# Déploie une ou plusieurs Edge Functions Supabase, à la demande, depuis `main`.
#
# Rien ne part tout seul : une fusion dans `main` ne déploie aucune fonction. On lance ce
# déploiement exprès, en nommant les fonctions :
#   - à la main : onglet Actions › « Déploiement des fonctions » › Run workflow ;
#   - ou par l'API (session Claude en ligne de Gianni, après son « oui » pour ce
#     déploiement précis, voir CLAUDE.md, « Travailler à deux »).
#
# Le code déployé est toujours celui de `main`, donc celui qui a passé la « Vérification
# des PR ». Un seul déploiement à la fois (les demandes suivantes attendent leur tour).
#
# Secret requis : SUPABASE_ACCESS_TOKEN (jeton personnel Supabase). Jamais dans un fichier ni
# dans une discussion.
#
# Environnement GitHub « fonctions » (job « déployer ») : le jeton y est rangé, et seul ce job
# le reçoit. Réglages à faire par le propriétaire du dépôt (Settings › Environments) :
#   1. créer l'environnement « fonctions » (s'il a été créé tout seul au premier lancement,
#      il existe déjà, sans aucune règle) ;
#   2. Deployment branches and tags : « Selected branches and tags », main seulement ;
#   3. Required reviewers : un fondateur, et cocher « Prevent self-review » (sans cette case,
#      celui qui lance le déploiement l'approuve lui-même) ;
#   4. y créer le secret SUPABASE_ACCESS_TOKEN, puis supprimer le secret de dépôt du même nom
#      (Settings › Secrets and variables › Actions), puis changer ce jeton dans Supabase
#      (Account › Access Tokens).
# Tant que le secret de dépôt existe, ce workflow marche comme avant (un secret de dépôt est lu
# aussi dans un environnement).
#
# Version de la CLI Supabase figée (SUPABASE_CLI) : jamais « la dernière publiée » avec le
# jeton dans l'environnement. Pour monter de version : changer ce numéro dans une PR.
on:
  workflow_dispatch:
    inputs:
      fonctions:
        description: "Fonctions à déployer, séparées par des espaces (ex. ttp-mcp rdv)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploiement-fonctions
  cancel-in-progress: false

jobs:
  deployer:
    name: déployer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Le jeton vit dans cet environnement (règles en tête de fichier) : une copie de ce
    # workflow lancée depuis une autre branche ne le reçoit pas.
    environment: fonctions
    env:
      PROJECT_REF: zizvggziggswhrbuyhuo
      SUPABASE_CLI: 2.122.1
      # Le texte saisi passe par une variable, jamais recopié dans une commande.
      FONCTIONS: ${{ inputs.fonctions }}
    steps:
      - name: Partir de main seulement
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Le déploiement part seulement de main (reçu : $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@v7

      - name: Vérifier la demande
        env:
          JETON_PRESENT: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$JETON_PRESENT" != "true" ]; then
            echo "::error::Le secret SUPABASE_ACCESS_TOKEN n'existe pas (environnement « fonctions », Settings › Environments)."
            exit 1
          fi
          read -r -a NOMS <<< "$FONCTIONS"
          if [ "${#NOMS[@]}" -eq 0 ]; then
            echo "::error::Aucune fonction demandée."
            exit 1
          fi
          if [ "${#NOMS[@]}" -gt 12 ]; then
            echo "::error::12 fonctions au plus par déploiement (reçu : ${#NOMS[@]})."
            exit 1
          fi
          for n in "${NOMS[@]}"; do
            if ! [[ "$n" =~ ^[a-z0-9][a-z0-9-]{0,60}$ ]]; then
              echo "::error::Nom de fonction refusé : $n"
              exit 1
            fi
            if [ ! -f "supabase/functions/$n/index.ts" ]; then
              echo "::error::Fonction inconnue dans main : $n"
              exit 1
            fi
          done
          echo "Demande valide : ${NOMS[*]}"

      - name: Déployer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          read -r -a NOMS <<< "$FONCTIONS"
          {
            echo "## Fonctions déployées"
            echo ""
            echo "Version de main : \`${GITHUB_SHA:0:12}\`, lancé par ${GITHUB_ACTOR}."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for n in "${NOMS[@]}"; do
            ARGS=(functions deploy "$n" --project-ref "$PROJECT_REF")
            # verify_jwt = false dans supabase/config.toml : on le redit au déploiement
            # (cron, webhook, retour OAuth, ttp-mcp : sinon 401 avant le code).
            if awk -v bloc="[functions.$n]" '
              $0 == bloc { dedans = 1; next }
              /^\[/ { dedans = 0 }
              dedans && /^verify_jwt[[:space:]]*=[[:space:]]*false/ { trouve = 1 }
              END { exit !trouve }
            ' supabase/config.toml; then
              ARGS+=(--no-verify-jwt)
            fi
            echo "::group::$n"
            echo "supabase ${ARGS[*]}"
            npx --yes "supabase@${SUPABASE_CLI}" "${ARGS[@]}"
            echo "::endgroup::"
            echo "- \`$n\`" >> "$GITHUB_STEP_SUMMARY"
          done
