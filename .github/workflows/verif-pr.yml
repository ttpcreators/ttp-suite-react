name: Vérification des PR

# Chaque PR vers main est vérifiée (lint, tests, types, build) avant la fusion.
# La règle de protection de main exige que ce contrôle passe.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verif-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  # Le code des Edge Functions (supabase/functions) n'est pas compilé par « build » : on le
  # contrôle ici avec Deno, comme Supabase l'exécute. Contrôle à part, pas encore exigé pour
  # fusionner (le rendre obligatoire dans la règle de main quand il est vert depuis une semaine).
  fonctions:
    name: fonctions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Contrôle des types des fonctions
        # Le package.json de l'app n'est pas celui des fonctions : Deno l'ignore et télécharge
        # lui-même les paquets « npm: » des fonctions, comme Supabase au déploiement.
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          set -euo pipefail
          ls supabase/functions/*/index.ts > /tmp/fonctions.txt
          echo "$(wc -l < /tmp/fonctions.txt) fonctions à contrôler"
          deno check --quiet $(cat /tmp/fonctions.txt)

  # Secrets ajoutés par la PR (seulement les commits de la PR : l'historique déjà fusionné n'est
  # pas rescanné). gitleaks à une version figée, vérifiée par son
  # empreinte SHA-256 ; rien n'est affiché en clair (--redact), les journaux étant publics.
  # Contrôle à part, pas encore exigé pour fusionner (comme « fonctions »).
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  /tmp/$archive" | sha256sum -c -
          tar -xzf "/tmp/$archive" -C /tmp gitleaks
      - name: Chercher des secrets dans les commits de la PR
        run: |
          set -euo pipefail
          /tmp/gitleaks git --no-banner --redact --verbose \
            --config .github/gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .
