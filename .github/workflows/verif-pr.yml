name: Vérification des PR

# Chaque PR vers main est vérifiée (lint, tests, types, build) avant la fusion.
# La règle de protection de main exige que ce contrôle passe.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verif-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
