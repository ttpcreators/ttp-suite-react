<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages ne pose pas d'en-têtes : une CSP minimale par balise (pas de plugin, pas de
         <base> ni de formulaire vers un autre site). frame-ancestors ne marche pas en balise. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <title>Connecter un assistant IA · TTP Suite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/connecteur/main.tsx"></script>
  </body>
</html>
